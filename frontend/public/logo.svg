<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect width="120" height="120" rx="28" fill="url(#shine)"/>
  <!-- Letter W -->
  <text x="50%" y="54%" dominant-baseline="central" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff"
        letter-spacing="-2">W</text>
  <!-- Small accent bar -->
  <rect x="34" y="88" width="52" height="5" rx="2.5" fill="rgba(255,255,255,0.4)"/>
</svg>
